<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5fc">
  <meta name="description" content="번호표를 골라 정해진 항목을 중복 없이 한 장씩 뽑습니다.">
  <title>제비뽑기 · 모아덱</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg?v=moadeck">
  <link rel="stylesheet" href="../assets/brand.css?v=game-motion">
  <link rel="stylesheet" href="../assets/utility.css">
  <script src="../assets/tool-theme.js"></script>
  <style>
    html { scrollbar-gutter: stable; }
    .ticket-top, .labels-top { justify-content: space-between; }
    .tickets { display: grid; grid-template-columns: repeat(auto-fit, minmax(54px, 1fr)); gap: 10px 8px; }
    .ticket {
      position: relative;
      display: block;
      justify-self: center;
      width: 100%;
      min-width: 0;
      max-width: 92px;
      aspect-ratio: 5 / 7;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--ink);
      perspective: 380px;
      -webkit-tap-highlight-color: transparent;
    }
    .ticket[aria-disabled="true"] { opacity: 1; }
    .ticket-flip {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }
    .ticket-face {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 9px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .ticket-front {
      border-color: var(--primary);
      background: linear-gradient(150deg, var(--primary), var(--wash) 175%);
      color: #fff;
      font-size: 14px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 4px #18092830;
    }
    .ticket-front::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid #ffffff74;
      border-radius: 5px;
    }
    .ticket-front::after {
      content: "";
      width: 22%;
      aspect-ratio: 1;
      border: 2px solid #ffffffb8;
      border-radius: 3px;
      background: #ffffff26;
      transform: rotate(45deg);
    }
    .ticket-number {
      position: absolute;
      top: 8px;
      left: 9px;
      line-height: 1;
    }
    .ticket-back {
      background: var(--surface);
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      box-shadow: inset 0 0 0 4px var(--wash), 0 2px 4px #18092820;
      transform: rotateY(180deg);
    }
    .ticket-label {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      width: 100%;
      overflow: hidden;
      overflow-wrap: anywhere;
      text-align: center;
    }
    .ticket.revealed .ticket-flip { transform: rotateY(180deg); }
    .ticket.latest .ticket-back { border-color: var(--accent); }
    .ticket.drawing { z-index: 2; }
    .ticket.drawing .ticket-face { box-shadow: 0 10px 22px #130b3344; }
    .ticket-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
    @media (max-width: 400px) {
      .ticket-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ticket-actions .primary { grid-column: 1 / -1; }
    }
    .draw-result {
      min-block-size: 55px;
      margin: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--muted);
      overflow-wrap: anywhere;
      font-size: 14px;
    }
    .draw-result[data-revealed="true"] { color: var(--success); font-weight: 800; }
    .list-form { gap: 10px; }
    .label-rows { display: grid; gap: 6px; }
    .label-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
    .label-row .btn { padding-inline: 10px; }
    .list-note { margin: 0; }
    summary { cursor: pointer; padding-block: 9px; color: var(--muted); font-weight: 650; }
    .history { margin: 0; padding-left: 24px; overflow-wrap: anywhere; }
    .history li { padding-block: 3px; }
  </style>
</head>
<body data-tool="lots">
  <main class="shell">
    <header><a class="brand" href="../" aria-label="모아덱 MoaDeck 홈"><img src="../assets/icon.svg?v=moadeck" width="38" height="38" alt=""><span>모아덱</span><small>MoaDeck</small></a><h1>제비뽑기</h1></header>
    <div class="game-motion" id="game-motion"></div>
    <div class="play-grid">
      <section class="panel play-panel" aria-label="제비뽑기">
        <div class="row ticket-top">
          <h2>번호표</h2>
          <span id="remaining" class="muted"></span>
        </div>
        <div id="tickets" class="tickets"></div>
        <div class="ticket-actions">
          <button id="pick" disabled type="button" class="btn primary">무작위로 한 장</button>
          <button id="reset" disabled type="button" class="btn">다시 섞기</button>
          <button id="undo" disabled type="button" class="btn">실행 취소</button>
        </div>
        <p id="result" class="draw-result" role="status">번호표를 고르세요.</p>
        <details id="drawHistory" hidden>
          <summary>뽑은 순서</summary>
          <ol id="history" class="history"></ol>
        </details>
      </section>
      <form id="labelsForm" class="panel list-form" aria-labelledby="labelsHeading">
        <div class="row labels-top">
          <h2 id="labelsHeading">항목 목록</h2>
          <span id="labelCount" class="muted">2~24개</span>
        </div>
        <button id="addLabel" disabled class="btn" type="button">＋ 항목 추가</button>
        <div id="labelRows" class="label-rows"></div>
        <button id="applyLabels" disabled class="btn" type="submit">목록 적용</button>
        <p id="listNote" class="muted list-note" hidden>변경한 목록을 적용하면 새 판으로 시작합니다.</p>
        <p id="listError" class="error" role="alert"></p>
      </form>
    </div>
  </main>
  <script type="module" src="../assets/lots.js?v=nicknames"></script>
</body>
</html>
