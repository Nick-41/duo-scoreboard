<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5fc">
  <meta name="description" content="여러 항목의 개수를 집계하고 합계를 확인하세요.">
  <title>멀티카운터 · 모아덱</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg?v=moadeck">
  <link rel="stylesheet" href="../assets/brand.css">
  <link rel="stylesheet" href="../assets/utility.css">
  <link rel="stylesheet" href="../assets/tally.css">
  <script src="../assets/tool-theme.js"></script>
</head>
<body data-tool="counters">
  <main class="shell">
    <header><a class="brand" href="../" aria-label="모아덱 MoaDeck 홈"><img src="../assets/icon.svg?v=moadeck" width="38" height="38" alt=""><span>모아덱</span><small>MoaDeck</small></a><h1>멀티카운터</h1></header>
    <section class="panel tally-top" aria-label="멀티카운터 설정">
      
      <p id="total" class="result"></p>
      <div class="row">
        <button type="button" id="edit" class="btn" aria-pressed="false">항목 편집</button>
        <button type="button" id="add" class="btn primary" hidden>＋ 항목 추가</button>
        <button type="button" id="undo" class="btn" disabled>실행 취소</button>
        <button type="button" id="reset" class="btn" disabled>수량 초기화</button>
      </div>
      <p id="saved" class="muted">이 기기에 자동 저장됩니다.</p>
      <p id="activity" class="sr-only" role="status"></p>
    </section>
    <section id="entries" class="tally-grid" aria-label="카운터 항목"></section>
    <dialog id="confirmReset">
      <form method="dialog">
        <h2>수량을 초기화할까요?</h2>
        <p class="muted">항목 이름는 보관됩니다.</p>
        <div class="row">
          <button type="submit" value="cancel" class="btn" autofocus>취소</button>
          <button type="submit" value="reset" class="btn primary">초기화</button>
        </div>
      </form>
    </dialog>
  </main>
  <template id="entryTemplate">
    <article class="panel tally-item">
      <h2 data-role="label"></h2>
      <div class="row item-edit" hidden>
        <input type="text" maxlength="40" class="field" data-role="name">
        <button type="button" class="btn remove" data-action="remove">삭제</button>
      </div>
      <div class="tally-values">
        <strong data-role="count" class="count-value"></strong>
        
      </div>
      
      <div class="tally-actions">
        <button type="button" class="btn minus" data-action="down">−</button><button type="button" class="btn primary plus" data-action="up">＋</button>
      </div>
    </article>
  </template>
  <script type="module" src="../assets/tally.js?v=add-without-focus"></script>
</body>
</html>
