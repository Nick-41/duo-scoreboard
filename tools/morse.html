<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5fc"><title>모스부호 학습기 · 모아덱</title>
<link rel="icon" href="../assets/icon.svg"><link rel="stylesheet" href="../assets/brand.css"><link rel="stylesheet" href="../assets/utility.css"><script src="../assets/tool-theme.js"></script>
<style>
.shell{max-width:1000px}.layout{display:grid;gap:12px;align-items:start}.panel{display:grid;gap:12px}.panel p{margin:0}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}.tabs button[aria-pressed=true],.choices button[aria-pressed=true]{background:var(--wash);border-color:var(--accent);color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}.stats div{background:var(--wash);padding:10px 4px;border-radius:12px}.stats strong{display:block;font-size:22px;font-variant-numeric:tabular-nums}.prompt{min-height:122px;display:grid;place-content:center;text-align:center;background:var(--wash);border-radius:14px;overflow-wrap:anywhere}.prompt strong{font-size:clamp(30px,8vw,52px);letter-spacing:.1em}.prompt .muted{margin-top:6px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choices .btn{min-height:57px;font-size:20px}.choices .correct{border:2px solid var(--success);color:var(--success)}.choices .wrong{border:2px solid var(--error);color:var(--error)}.feedback{min-height:48px;line-height:1.5;font-size:14px;overflow-wrap:anywhere}.keyrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.keyrow button{min-height:50px;font-size:20px}.key{min-height:84px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.key.active{background:var(--primary);color:white}.sequence{min-height:44px;padding:8px;background:var(--wash);border-radius:10px;text-align:center;font-size:25px;overflow-wrap:anywhere}.alphabet{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}.alphabet button{display:grid;place-items:center;gap:4px;padding:8px 2px;min-height:58px}.alphabet b{font-size:18px}.alphabet span{white-space:nowrap;font-size:12px;letter-spacing:1px;color:var(--muted)}label{font-size:14px;font-weight:700}select{font:inherit}input[type=range]{width:100%;accent-color:var(--primary)}.setting{display:grid;gap:5px}.translator textarea{min-height:95px}.out{white-space:pre-wrap;overflow-wrap:anywhere;min-height:75px;padding:12px;border-radius:10px;background:var(--wash);font-family:ui-monospace,monospace}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{min-height:22px}.audio-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(min-width:700px){.layout{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:360px){.tabs .btn{padding-inline:4px}.panel{padding:12px}.alphabet{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head>
<body data-tool="morse"><main class="shell">
<header><a class="brand" href="../" aria-label="모아덱 홈"><img src="../assets/icon.svg" width="38" height="38" alt=""><span>모아덱</span><small>MoaDeck</small></a><h1>모스부호 학습기</h1></header>
<nav class="tabs" aria-label="학습 모드">
<button class="btn" data-mode="decode" aria-pressed="true">해독 퀴즈</button><button class="btn" data-mode="encode" aria-pressed="false">부호 퀴즈</button><button class="btn" data-mode="listen" aria-pressed="false">청음 퀴즈</button><button class="btn" data-mode="key" aria-pressed="false">송신 연습</button><button class="btn" data-mode="translate" aria-pressed="false">변환기</button>
</nav>
<div class="layout">
<section class="panel" id="practice">
<div class="stats"><div><span class="muted">푼 문제</span><strong id="total">0</strong></div><div><span class="muted">정답률</span><strong id="accuracy">—</strong></div><div><span class="muted">연속 정답</span><strong id="streak">0</strong></div></div>
<div class="prompt"><strong id="question"></strong><span class="muted" id="instruction"></span></div>
<div class="audio-actions"><button class="btn" id="play">▶ 소리 듣기</button><button class="btn" id="stop">재생 중지</button></div>
<div class="choices" id="choices"></div>
<div id="keybox" hidden><div id="sequence" class="sequence" aria-live="polite">—</div><div class="keyrow"><button class="btn" id="dot" aria-label="점">·</button><button class="btn" id="dash" aria-label="선">−</button><button class="btn" id="back" aria-label="마지막 부호 삭제">⌫</button></div><button class="btn key" id="key" style="width:100%;margin-top:8px">누르고 떼기 · 짧게 점 / 길게 선</button><p class="muted" id="keyhint">PC: 스페이스바로 송신</p><button class="btn primary" id="check" style="width:100%">정답 확인</button></div>
<div class="actions"><button class="btn" id="reveal">정답 보기</button><button class="btn primary" id="next">다음 문제</button></div>
<div class="feedback" id="feedback" role="status"></div>
</section>
<section class="panel translator" id="translator" hidden><h2>문자 ↔ 모스부호</h2><label for="direction">변환 방향</label><select id="direction" class="field"><option value="text">문자 → 모스부호</option><option value="morse">모스부호 → 문자</option></select><label for="source">입력</label><textarea class="field" id="source" maxlength="500" placeholder="HELLO WORLD"></textarea><label>변환 결과</label><output class="out" id="converted"></output><div class="actions"><button class="btn primary" id="playTranslation">▶ 소리 듣기</button><button class="btn" id="copy">복사</button><button class="btn" id="stopTranslation">재생 중지</button><button class="btn" id="clear">지우기</button></div><p class="muted">영문 A–Z, 숫자 0–9 지원. 글자는 공백, 단어는 / 로 구분합니다. 미지원 문자는 ?로 표시하며 해당 입력은 소리 재생이 제한됩니다.</p><p class="muted status" id="translateStatus" role="status"></p></section>
<aside class="panel"><h2>학습 설정</h2><label for="group">학습 범위</label><select class="field" id="group"><option value="basic">입문 · E T I M A N S O</option><option value="letters">영문 A–Z</option><option value="digits">숫자 0–9</option><option value="all">영문 + 숫자</option><option value="missed">오답 복습</option></select>
<div class="setting"><label for="speed">속도 <span id="speedLabel"></span> WPM</label><input id="speed" type="range" min="5" max="30" value="12"></div><div class="setting"><label for="pitch">음높이 <span id="pitchLabel"></span> Hz</label><input id="pitch" type="range" min="400" max="1000" step="50" value="650"></div>
<p class="muted">점 : 선 = 1 : 3 · 글자 간격 3 · 단어 간격 7</p><h2>모스부호 표</h2><p class="muted">글자를 누르면 해당 소리가 재생됩니다. 퀴즈 중에는 접어 두고 연습하세요.</p><details><summary>전체 부호표 열기</summary><div class="alphabet" id="alphabet" style="margin-top:10px"></div></details><p class="muted" id="reviewCount"></p><button class="btn" id="reset">학습 기록 초기화</button><p class="muted">기록과 설정은 현재 브라우저에 자동 저장됩니다.</p></aside>
</div></main>
<script>
'use strict';
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', codes='.- -... -.-. -.. . ..-. --. .... .. .--- -.- .-.. -- -. --- .--. --.- .-. ... - ..- ...- .-- -..- -.-- --.. ----- .---- ..--- ...-- ....- ..... -.... --... ---.. ----.'.split(' ');
const map=Object.fromEntries([...letters].map((c,i)=>[c,codes[i]])), reverse=Object.fromEntries(Object.entries(map).map(([k,v])=>[v,k]));
const $=id=>document.getElementById(id), pretty=s=>s.replaceAll('.','·').replaceAll('-','−'), storage='moadeck-morse-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(storage))||{}}catch{}
let stats={total:0,right:0,streak:0,missed:{},...(saved.stats||{})};let mode='decode',current='',done=false,sequence='',ctx=null,nodes=[],soundVersion=0,pressed=null,tone=null;
const group=$('group'),speed=$('speed'),pitch=$('pitch');
if(['basic','letters','digits','all','missed'].includes(saved.group))group.value=saved.group;
speed.value=saved.speed??12;pitch.value=saved.pitch??650;
function persist(){try{localStorage.setItem(storage,JSON.stringify({stats,group:group.value,speed:speed.value,pitch:pitch.value}))}catch{}}
function showStats(){$('total').textContent=stats.total;$('accuracy').textContent=stats.total?Math.round(100*stats.right/stats.total)+'%':'—';$('streak').textContent=stats.streak;$('reviewCount').textContent='복습할 문자 '+Object.keys(stats.missed).filter(c=>stats.missed[c]>0).length+'개';persist()}
function pool(){switch(group.value){case'basic':return [...'ETIMANSO'];case'letters':return [...letters.slice(0,26)];case'digits':return [...letters.slice(26)];case'missed':return Object.keys(stats.missed).filter(c=>map[c]&&stats.missed[c]>0);default:return [...letters]}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stop(){soundVersion++;for(const n of nodes){try{n.stop()}catch{}}nodes=[]}
async function audio(){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('audio unavailable');ctx??=new C();if(ctx.state==='suspended')await ctx.resume();return ctx}
const unit=()=>1.2/Number(speed.value);
async function play(code){stop();const version=soundVersion;try{const a=await audio();if(version!==soundVersion)return;let t=a.currentTime+.05;const u=unit(),freq=Number(pitch.value);const words=code.trim().split(/\s*\/\s*/);for(let w=0;w<words.length;w++){const chars=words[w].trim().split(/\s+/);for(let i=0;i<chars.length;i++){for(let j=0;j<chars[i].length;j++){const c=chars[i][j];if(c!=='.'&&c!=='-')continue;const duration=u*(c==='.'?1:3),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.005);g.gain.setValueAtTime(.18,t+duration-.005);g.gain.linearRampToValueAtTime(0,t+duration);o.connect(g).connect(a.destination);o.start(t);o.stop(t+duration);nodes.push(o);o.onended=()=>{o.disconnect();g.disconnect();nodes=nodes.filter(n=>n!==o)};t+=duration+(j<chars[i].length-1?u:0)}if(i<chars.length-1)t+=3*u}if(w<words.length-1)t+=7*u}}catch{(mode==='translate'?$('translateStatus'):$('feedback')).textContent='소리를 재생할 수 없습니다. 브라우저 오디오 설정을 확인하세요.'}}
function updateKey(){ $('sequence').textContent=sequence?pretty(sequence):'—';$('check').disabled=done||!sequence||!current;['dot','dash','back','key'].forEach(id=>$(id).disabled=done||!current)}
function newQuestion(){stop();release(false);done=false;sequence='';const p=pool();const candidates=p.filter(c=>c!==current);current=shuffle(candidates.length?candidates:[...p])[0]||'';$('feedback').textContent='';$('choices').replaceChildren();$('keybox').hidden=mode!=='key';$('play').disabled=!current||mode==='listen'&&false;$('reveal').disabled=!current;$('next').disabled=!current;if(!current){$('question').textContent='복습 완료';$('instruction').textContent='다른 학습 범위를 선택하세요';updateKey();return}
$('question').textContent=mode==='decode'?pretty(map[current]):mode==='listen'?'♪':current;$('instruction').textContent=({decode:'이 부호는 어떤 문자일까요?',encode:'이 문자의 모스부호를 고르세요',listen:'소리 듣기를 누르고 문자를 맞히세요',key:'점과 선을 입력하세요'})[mode];
if(mode!=='key'){const wrong=shuffle(p.filter(c=>c!==current));const supplement=shuffle([...letters].filter(c=>c!==current&&!wrong.includes(c)));const choices=shuffle([current,...wrong.concat(supplement).slice(0,3)]);for(const c of choices){const b=document.createElement('button');b.className='btn';b.textContent=mode==='encode'?pretty(map[c]):c;b.dataset.answer=c;b.onclick=()=>grade(c===current,c);$('choices').append(b)}}updateKey()}
function grade(correct,chosen){if(done||!current)return;done=true;stats.total++;if(correct){stats.right++;stats.streak++;if(stats.missed[current]){stats.missed[current]--;if(stats.missed[current]<=0)delete stats.missed[current]}}else{stats.streak=0;stats.missed[current]=(stats.missed[current]||0)+1}
$('feedback').textContent=(correct?'정답! ':'오답 · 정답: ')+current+' = '+pretty(map[current]);$('feedback').style.color=correct?'var(--success)':'var(--error)';$('choices').querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.dataset.answer===current)b.classList.add('correct');else if(b.dataset.answer===chosen)b.classList.add('wrong')});$('reveal').disabled=true;updateKey();showStats()}
function append(c){if(!done&&current&&sequence.length<5){sequence+=c;updateKey()}}
async function press(){if(mode!=='key'||done||!current||pressed!==null)return;stop();pressed=performance.now();$('key').classList.add('active');try{const a=await audio();if(pressed===null)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=Number(pitch.value);g.gain.value=.15;o.connect(g).connect(a.destination);o.start();tone={o,g}}catch{}}
function release(record=true){if(pressed===null)return;const d=performance.now()-pressed;pressed=null;$('key').classList.remove('active');if(tone){try{tone.o.stop();tone.o.disconnect();tone.g.disconnect()}catch{}tone=null}if(record)append(d<unit()*2000?'.':'-')}
$('key').addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();$('key').setPointerCapture(e.pointerId);press()});$('key').addEventListener('pointerup',()=>release());$('key').addEventListener('pointercancel',()=>release(false));$('key').addEventListener('lostpointercapture',()=>release(false));window.addEventListener('blur',()=>release(false));document.addEventListener('visibilitychange',()=>{if(document.hidden){release(false);stop()}});
document.addEventListener('keydown',e=>{if(mode==='key'&&e.code==='Space'&&!e.target.matches('button,input,select,textarea,summary,a')){e.preventDefault();if(!e.repeat)press()}});document.addEventListener('keyup',e=>{if(e.code==='Space'&&pressed!==null){e.preventDefault();release()}});
$('dot').onclick=()=>append('.');$('dash').onclick=()=>append('-');$('back').onclick=()=>{if(!done){sequence=sequence.slice(0,-1);updateKey()}};$('check').onclick=()=>grade(sequence===map[current]);$('reveal').onclick=()=>grade(false);$('next').onclick=()=>newQuestion();$('play').onclick=()=>play(map[current]);$('stop').onclick=stop;
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{stop();release(false);mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('practice').hidden=mode==='translate';$('translator').hidden=mode!=='translate';if(mode==='translate')convert();else newQuestion()});
group.onchange=()=>{persist();if(mode!=='translate')newQuestion()};function settings(){$('speedLabel').textContent=speed.value;$('pitchLabel').textContent=pitch.value;$('keyhint').textContent='PC: 스페이스바 · '+Math.round(unit()*2000)+'ms 미만은 점';persist()}speed.oninput=pitch.oninput=settings;
for(const c of letters){const b=document.createElement('button');b.className='btn';const strong=document.createElement('b'),span=document.createElement('span');strong.textContent=c;span.textContent=pretty(map[c]);b.append(strong,span);b.onclick=()=>play(map[c]);$('alphabet').append(b)}
function encode(text){return text.toUpperCase().trim().split(/\s+/).map(w=>[...w].map(c=>map[c]||'?').join(' ')).join(' / ')}
function decode(text){return text.replaceAll('·','.').replaceAll('−','-').trim().split(/\s*\/\s*/).map(w=>w.trim().split(/\s+/).filter(Boolean).map(c=>reverse[c]||'?').join('')).join(' ')}
function convert(){stop();$('translateStatus').textContent='';const src=$('source').value.trim();const result=!src?'':$('direction').value==='text'?encode(src):decode(src);$('converted').textContent=result;$('playTranslation').disabled=!result||result.includes('?');$('copy').disabled=!result}
$('source').oninput=convert;$('direction').onchange=()=>{$('source').placeholder=$('direction').value==='text'?'HELLO WORLD':'.... . .-.. .-.. --- / .-- --- .-. .-.. -..';convert()};$('clear').onclick=()=>{$('source').value='';convert()};$('stopTranslation').onclick=stop;$('playTranslation').onclick=()=>play($('direction').value==='text'?$('converted').textContent:encode($('converted').textContent));$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('converted').textContent);$('translateStatus').textContent='복사했습니다.'}catch{$('translateStatus').textContent='복사할 수 없습니다. 결과를 길게 눌러 복사하세요.'}};
$('reset').onclick=()=>{if(confirm('학습 기록과 오답 목록을 초기화할까요?')){stats={total:0,right:0,streak:0,missed:{}};showStats();if(mode!=='translate')newQuestion()}};
settings();showStats();newQuestion();convert();
</script></body></html>
