<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5fc">
  <meta name="description" content="모아덱에서 동전이나 여섯 면 주사위를 한 번에 최대 20개 던져 보세요.">
  <title>동전 · 주사위 · 모아덱</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg?v=moadeck">
  <link rel="stylesheet" href="../assets/brand.css?v=game-motion">
  <script src="../assets/tool-theme.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5fc;
      --surface: #fff;
      --ink: #231a3c;
      --muted: #635976;
      --line: #dfd8eb;
      --accent: #6042ac;
      --active: #ece4ff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #171124;
      --surface: #211932;
      --ink: #f7f1ff;
      --muted: #c5bad7;
      --line: #443956;
      --accent: #d1beff;
      --active: #362650;
    }
    * { box-sizing: border-box; }
    html { scrollbar-gutter: stable; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    main { max-width: 720px; margin: auto; padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(17px, 4vw, 24px); letter-spacing: -.04em; }
    button, input { font: inherit; }
    button { min-height: 44px; color: var(--ink); cursor: pointer; touch-action: manipulation; }
    button:disabled { opacity: .42; cursor: default; }
    :where(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .panel { padding: clamp(14px, 4vw, 26px); border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 5px; border-radius: 12px; background: var(--bg); }
    .modes button { border: 0; border-radius: 8px; background: transparent; font-weight: 700; }
    .modes button[aria-pressed="true"] { color: var(--accent); background: var(--active); }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-top: 18px; }
    .count label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--muted); }
    .stepper { display: flex; gap: 5px; }
    .stepper button, .stepper input { min-height: 44px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .stepper button { min-width: 44px; font-size: 19px; font-weight: 750; }
    .stepper input { width: 56px; padding: 0; color: var(--ink); text-align: center; appearance: textfield; }
    .stepper input::-webkit-inner-spin-button { appearance: none; }
    .roll { flex: 1 1 120px; padding: 8px 15px; border: 0; border-radius: 10px; background: #6042ac; color: white; font-weight: 750; }
    .summary { margin-top: 16px; color: var(--muted); font-size: 14px; }
    .summary:empty { margin-top: 0; }
    .summary strong { display: block; color: var(--ink); font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .summary strong + span { display: block; margin-top: 5px; }
    .face-counts { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; margin: 12px 0 0; }
    .face-counts div { padding: 7px 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: center; }
    .face-counts dt { font-size: 12px; }
    .face-counts dd { margin: 3px 0 0; color: var(--ink); font-weight: 750; font-variant-numeric: tabular-nums; }
    .roll[aria-disabled="true"] { opacity: .72; cursor: default; }
    .throw-stage { position: relative; margin-top: 18px; }
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(45px, 1fr));
      align-content: center;
      gap: 10px;
      min-height: 138px;
      margin: 0;
      padding: 32px 12px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: radial-gradient(ellipse at center, var(--surface), var(--active));
      list-style: none;
    }
    .stage-placeholder { display: none; }
    .results:empty + .stage-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }
    .results li {
      --piece-size: 38px;
      position: relative;
      display: grid;
      place-items: center;
      min-height: 56px;
      perspective: 450px;
    }
    .results li:only-child { --piece-size: 57px; min-height: 88px; }
    .shadow {
      position: absolute;
      bottom: 3px;
      width: var(--piece-size);
      height: 10px;
      border-radius: 50%;
      background: #171124;
      opacity: .18;
      filter: blur(4px);
    }
    .toss, .piece { display: block; width: var(--piece-size); height: var(--piece-size); transform-style: preserve-3d; }
    .piece {
      position: relative;
      transform: rotateX(var(--rest-x)) rotateY(var(--rest-y));
    }
    .piece-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .coin-side {
      border: 2px solid #b37a2b;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 24%, #fff5ca, #f1c260 78%);
      box-shadow: inset 0 0 0 2px #fef0bd, 0 2px 2px #58330055;
      color: #62400b;
      font-size: 14px;
      font-weight: 850;
      transform: translateZ(1.5px);
    }
    .coin-side.tail {
      border-color: #837393;
      background: radial-gradient(circle at 30% 24%, #faf7ff, #c2b4d7 80%);
      box-shadow: inset 0 0 0 2px #f2ebfa, 0 2px 2px #30204755;
      color: #49385a;
      transform: rotateX(180deg) translateZ(1.5px);
    }
    .die-face {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 4px;
      border: 1px solid #9b8bbb;
      border-radius: 18%;
      background: linear-gradient(140deg, #fff, #d9cbee);
      box-shadow: inset 0 -2px 2px #74599b44;
      color: #382669;
      transform: var(--face-turn) translateZ(calc(var(--piece-size) / 2));
    }
    .pip { width: 48%; aspect-ratio: 1; border-radius: 50%; background: currentColor; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <header><a class="brand" href="../" aria-label="모아덱 MoaDeck 홈"><img src="../assets/icon.svg?v=moadeck" width="38" height="38" alt=""><span>모아덱</span><small>MoaDeck</small></a><h1>동전 · 주사위</h1></header>
    <section class="panel" aria-label="동전 및 주사위 던지기">
      <div class="modes" role="group" aria-label="종류">
        <button type="button" data-mode="coin" aria-pressed="true">동전</button>
        <button type="button" data-mode="dice" aria-pressed="false">주사위</button>
      </div>
      <div class="game-motion" id="game-motion"></div>
      <form class="controls">
        <div class="count">
          <label for="count">개수 (1~20)</label>
          <div class="stepper">
            <button id="less" type="button" aria-label="개수 줄이기">−</button>
            <input id="count" type="number" inputmode="numeric" min="1" max="20" step="1" value="1" required>
            <button id="more" type="button" aria-label="개수 늘리기">＋</button>
          </div>
        </div>
        <button id="roll" class="roll" type="submit">동전 던지기</button>
      </form>
      <div class="throw-stage">
        <ol id="results" class="results" aria-label="개별 결과"></ol>
        <p class="stage-placeholder">개수를 정한 뒤 던지세요.</p>
      </div>
      <div id="summary" class="summary" role="status" aria-atomic="true"></div>
    </section>
  </main>
  <script type="module">
    import { randomIndex } from '../assets/utility.js';
    import { gameMotion, playFrames } from '../assets/game-motion.js?v=momentum';

    const modes = { coin: { count: 1, results: [] }, dice: { count: 1, results: [] } };
    const faces = [[], [5], [1, 9], [1, 5, 9], [1, 3, 7, 9], [1, 3, 5, 7, 9], [1, 3, 4, 6, 7, 9]];
    const count = document.getElementById('count');
    const less = document.getElementById('less');
    const more = document.getElementById('more');
    const roll = document.getElementById('roll');
    const summary = document.getElementById('summary');
    const results = document.getElementById('results');
    const modeButtons = document.querySelectorAll('[data-mode]');
    const fullMotion = gameMotion(document.getElementById('game-motion'));
    const motionMs = 760;
    const dieTurns = ['rotateY(0deg)', 'rotateY(90deg)', 'rotateX(90deg)', 'rotateX(-90deg)', 'rotateY(-90deg)', 'rotateY(180deg)'];
    const dieRest = [[0, 0], [0, -90], [-90, 0], [90, 0], [0, 90], [0, 180]];
    let active = 'coin';
    let rolling = false;

    function updateCount() {
      const valid = count.validity.valid;
      if (valid) modes[active].count = count.valueAsNumber;
      less.disabled = rolling || (valid && count.valueAsNumber <= Number(count.min));
      more.disabled = rolling || (valid && count.valueAsNumber >= Number(count.max));
    }

    function step(amount) {
      const value = Number.isFinite(count.valueAsNumber) ? Math.round(count.valueAsNumber) : modes[active].count;
      count.value = Math.max(Number(count.min), Math.min(Number(count.max), value + amount));
      updateCount();
    }

    function coinFace(tails) {
      const face = document.createElement('span');
      face.className = tails ? 'piece-face coin-side tail' : 'piece-face coin-side';
      face.textContent = tails ? '뒤' : '앞';
      return face;
    }

    function dieFace(turn, index) {
      const face = document.createElement('span');
      face.className = 'piece-face die-face';
      face.style.setProperty('--face-turn', turn);
      for (const position of faces[index + 1]) {
        const pip = document.createElement('span');
        pip.className = 'pip';
        pip.style.gridArea = (Math.floor((position - 1) / 3) + 1) + ' / ' + ((position - 1) % 3 + 1);
        face.append(pip);
      }
      return face;
    }

    function renderResult(value, index) {
      const item = document.createElement('li');

      const label = document.createElement('span');
      label.className = 'sr-only';
      const toss = document.createElement('span');
      toss.className = 'toss';
      toss.setAttribute('aria-hidden', 'true');
      const shadow = document.createElement('span');
      shadow.className = 'shadow';
      shadow.setAttribute('aria-hidden', 'true');
      const piece = document.createElement('span');
      piece.className = 'piece';

      if (active === 'coin') {
        piece.style.setProperty('--rest-x', value === 1 ? '0deg' : '180deg');
        piece.style.setProperty('--rest-y', '0deg');
        piece.append(coinFace(false), coinFace(true));
        label.textContent = (index + 1) + '번 동전 ' + (value === 1 ? '앞면' : '뒷면');
      } else {
        const [x, y] = dieRest[value - 1];
        piece.style.setProperty('--rest-x', x + 'deg');
        piece.style.setProperty('--rest-y', y + 'deg');
        piece.append(...dieTurns.map(dieFace));
        label.textContent = (index + 1) + '번 주사위 ' + value;
      }
      toss.append(piece);
      item.append(label, shadow, toss);
      return item;
    }

    function renderResults() {
      const values = modes[active].results;
      results.replaceChildren(...values.map(renderResult));
      if (rolling) {
        summary.textContent = active === 'coin' ? '동전 던지는 중…' : '주사위 굴리는 중…';
        return;
      }
      announceResults(values);
    }

    function announceResults(values) {
      if (!values.length) {
        summary.replaceChildren();
        return;
      }
      const total = document.createElement('strong');
      const detail = document.createElement('span');
      if (active === 'coin') {
        const heads = values.filter(value => value === 1).length;
        total.textContent = '합계 ' + heads + '점';
        detail.textContent = '앞면 ' + heads + '개 (1점) · 뒷면 ' + (values.length - heads) + '개 (0점)';
        summary.replaceChildren(total, detail);
      } else {
        total.textContent = '합계 ' + values.reduce((sum, value) => sum + value, 0);
        detail.textContent = '주사위 ' + values.length + '개';
        const counts = Array(6).fill(0);
        for (const value of values) counts[value - 1]++;
        const distribution = document.createElement('dl');
        distribution.className = 'face-counts';
        distribution.setAttribute('aria-label', '눈별 개수');
        for (const [index, count] of counts.entries()) {
          const group = document.createElement('div');
          const face = document.createElement('dt');
          face.textContent = (index + 1) + ' 눈';
          const quantity = document.createElement('dd');
          quantity.textContent = count + '개';
          group.append(face, quantity);
          distribution.append(group);
        }
        summary.replaceChildren(total, detail, distribution);
      }
    }

    for (const button of modeButtons) {
      button.addEventListener('click', () => {
        active = button.dataset.mode;
        count.value = modes[active].count;
        updateCount();
        for (const option of modeButtons) option.setAttribute('aria-pressed', String(option === button));
        roll.textContent = active === 'coin' ? '동전 던지기' : '주사위 굴리기';
        renderResults();
      });
    }
    less.addEventListener('click', () => step(-1));
    more.addEventListener('click', () => step(1));
    count.addEventListener('input', updateCount);
    // The bounce and spin share one clock, so the revealed face matches the final transform.
    const bounce = [[0, 12, .76], [.34, -26, 1.13], [.68, 6, 1.02], [.82, -5, 1], [1, 0, 1]];

    function animateThrow(values) {
      if (!fullMotion()) {
        return playFrames(190, progress => { results.style.opacity = .55 + .45 * progress; });
      }
      const pieces = [...results.children].map((item, index) => {
        const [x, y] = active === 'coin' ? [values[index] === 1 ? 0 : 180, 0] : dieRest[values[index] - 1];
        return {
          x, y, delay: Math.min(index, 9) * 12, direction: index % 2 === 0 ? -1 : 1,
          toss: item.querySelector('.toss'), piece: item.querySelector('.piece'), shadow: item.querySelector('.shadow'),
        };
      });
      const duration = motionMs + pieces.at(-1).delay;
      return playFrames(duration, progress => {
        for (const { x, y, delay, direction, toss, piece, shadow } of pieces) {
          const at = Math.min(1, Math.max(0, (progress * duration - delay) / motionMs));
          const end = bounce.findIndex(([t], index) => index > 0 && at <= t);
          const [from, startY, startScale] = bounce[end - 1];
          const [to, endY, endScale] = bounce[end];
          const along = (at - from) / (to - from);
          const height = startY + (endY - startY) * along;
          const scale = startScale + (endScale - startScale) * along;
          const drift = direction * 16 * (1 - at) ** 2;
          const turn = (1 - at) ** 1.9;
          toss.style.transform = 'translate(' + drift + 'px,' + height + 'px) scale(' + scale + ')';
          piece.style.transform = 'rotateX(' + (x + turn * (active === 'coin' ? 1260 : 900)) + 'deg) rotateY(' +
            (y + (active === 'coin' ? 0 : turn * direction * 720)) + 'deg)';
          shadow.style.opacity = Math.max(.05, .18 + height / 95);
        }
      });
    }

    document.querySelector('form').addEventListener('submit', async event => {
      event.preventDefault();
      if (rolling) return;
      updateCount();
      const sides = active === 'coin' ? 2 : 6;
      const values = Array.from({ length: modes[active].count }, () => randomIndex(sides) + 1);
      modes[active].results = values;
      rolling = true;
      roll.setAttribute('aria-disabled', 'true');
      count.readOnly = true;
      for (const button of modeButtons) button.disabled = true;
      updateCount();
      results.setAttribute('aria-hidden', 'true');
      renderResults();
      await animateThrow(values);

      rolling = false;
      roll.removeAttribute('aria-disabled');
      count.readOnly = false;
      for (const button of modeButtons) button.disabled = false;
      updateCount();
      results.style.opacity = '';
      results.removeAttribute('aria-hidden');
      renderResults();
    });
    updateCount();
    renderResults();
  </script>
</body>
</html>
