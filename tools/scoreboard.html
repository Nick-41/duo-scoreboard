<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#171124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="모아덱 점수판">
<title>점수판 · 모아덱</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;--bg:#171124;--text:#f8fafc;--muted:#a9b3c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;min-height:100dvh;background:var(--bg);color:var(--text);overscroll-behavior-y:contain}
main{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) max(12px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(12px,env(safe-area-inset-left));gap:12px;max-width:1600px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.titlebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(16px,3vw,20px);letter-spacing:-.02em;margin:0;font-weight:700}
button{font:inherit;touch-action:manipulation;cursor:pointer;border:0;border-radius:12px;color:var(--text);font-weight:750}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
header nav{display:flex;gap:8px}
nav button{background:#2d2241;padding:11px 13px;font-size:14px}
nav button:active{background:#49365e}
#undo:disabled{opacity:.45;cursor:default}
.team-count{display:flex;align-items:center;gap:3px;background:#2d2241;padding:4px;border-radius:12px}
.team-count span{color:var(--muted);font-size:12px;padding:0 7px 0 4px}
.team-count button{min-width:39px;min-height:37px;background:transparent;font-size:15px}
.team-count button[aria-pressed="true"]{background:#7255bc;color:#fff}
.board{display:grid;grid-template-columns:1fr;gap:12px;flex:1;align-content:stretch;min-height:0}
.team{--tint:#54a8ff;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 17%,#1c2330) 0%,#161b25 100%);border:2px solid color-mix(in srgb,var(--tint) 45%,#334155);border-radius:22px;min-width:0;min-height:180px;display:flex;flex-direction:column;align-items:stretch;padding:clamp(10px,2vw,18px);gap:8px;overflow:hidden}
.team.b{--tint:#ffba59}
.team.c{--tint:#84e0af}
.team.d{--tint:#cb9bff}
.name{display:block;margin:auto auto 0;max-width:100%;width:86%;min-width:0;background:transparent;border:0;color:inherit;text-align:center;font-weight:750;font-size:clamp(19px,4vw,34px);padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--tint) 30%,transparent);border-radius:0;outline:none}
.name::placeholder{color:#c3cad6}
.score{font-weight:850;text-align:center;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.07em;white-space:nowrap;font-size:clamp(62px,22vw,180px);margin:auto 0;text-shadow:0 5px 18px #0003}
.board[data-count="2"] .team{min-height:240px}
.board[data-count="2"] .score{font-size:clamp(90px,28vw,240px)}
.controls{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:auto}
.controls button{min-height:clamp(54px,9vh,100px);font-size:clamp(30px,5vw,50px);transition:transform .08s}
.controls button:active{transform:scale(.97)}
.minus{background:#343c4c}
.plus{background:var(--tint);color:#111722}
.note{color:var(--muted);text-align:center;font-size:12px;margin:0}
#announce{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
@media(min-width:650px){
main{gap:12px}
.board{grid-template-columns:repeat(2,minmax(0,1fr))}
.board[data-count="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.team{min-height:0}
.board[data-count="2"] .score{font-size:clamp(100px,19vw,290px)}
.board[data-count="3"] .score,.board[data-count="4"] .score{font-size:clamp(72px,12vw,170px)}
.controls button{min-height:clamp(62px,12vh,125px)}
.name{font-size:clamp(22px,3vw,36px)}
}
@media(max-height:620px){
main{gap:7px;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}
.team{padding:8px;gap:2px;min-height:150px}
.board[data-count="2"] .team{min-height:150px}
.score,.board[data-count="2"] .score,.board[data-count="3"] .score,.board[data-count="4"] .score{font-size:clamp(55px,17vh,145px)}
.name{font-size:19px}
.controls button{min-height:49px}
.note{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg?v=moadeck">
<link rel="stylesheet" href="../assets/brand.css">
</head>
<body>
<main>
<header>
<a class="brand" href="../" aria-label="모아덱 MoaDeck 홈"><img src="../assets/icon.svg?v=moadeck" width="38" height="38" alt=""><span>모아덱</span><small>MoaDeck</small></a>
<div class="titlebar">
<h1>점수판</h1>
<div class="team-count" role="group" aria-label="표시할 팀 수"><span>팀 수</span>
<button type="button" data-count="2" aria-pressed="true">2</button>
<button type="button" data-count="3" aria-pressed="false">3</button>
<button type="button" data-count="4" aria-pressed="false">4</button>
</div>
</div>
<nav aria-label="공통 기능"><button id="undo" type="button">실행 취소</button><button id="reset" type="button">점수 초기화</button></nav>
</header>
<section id="board" class="board" data-count="2" aria-label="팀별 점수판"></section>
<p class="note">팀 수를 줄여도 기존 점수는 유지됩니다. 점수와 팀 이름은 이 기기에 자동 저장됩니다.</p>
<div id="announce" role="status" aria-live="polite"></div>
</main>
<script type="module">
import { randomNickname } from '../assets/nicknames.js?v=two-word';
'use strict';
const KEY='duo-scoreboard-v2';
const OLD_KEY='duo-scoreboard-v1';
const letters=['A','B','C','D'];
const defaults={count:2,scores:[0,0,0,0],names:['A팀','B팀','C팀','D팀']};
let state={count:defaults.count,maxTeams:defaults.count,scores:[...defaults.scores],names:[...defaults.names]};
let history=[];
try{
 const next=JSON.parse(localStorage.getItem(KEY));
 if(next&&Number.isInteger(next.count)&&next.count>=2&&next.count<=4&&
    Array.isArray(next.scores)&&next.scores.length===4&&next.scores.every(n=>Number.isSafeInteger(n)&&n>=0)&&
    Array.isArray(next.names)&&next.names.length===4&&next.names.every(n=>typeof n==='string')){
   const knownTeams=next.names.reduce((count,name,i)=>
     name!==defaults.names[i]||next.scores[i]!==0?Math.max(count,i+1):count,next.count);
   const maxTeams=Number.isInteger(next.maxTeams)&&next.maxTeams<=4?Math.max(knownTeams,next.maxTeams):knownTeams;
   state={count:next.count,maxTeams,scores:[...next.scores],names:next.names.map(n=>n.slice(0,20))};
 }else{
   const old=JSON.parse(localStorage.getItem(OLD_KEY));
   if(old&&Array.isArray(old.scores)&&old.scores.length===2&&old.scores.every(n=>Number.isSafeInteger(n)&&n>=0)&&
      Array.isArray(old.names)&&old.names.length===2&&old.names.every(n=>typeof n==='string')){
      state.scores[0]=old.scores[0];state.scores[1]=old.scores[1];
      state.names[0]=old.names[0].slice(0,20);state.names[1]=old.names[1].slice(0,20);
   }
 }
}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function buildTeams(){
 const board=document.getElementById('board');
 board.replaceChildren();
 board.dataset.count=String(state.count);
 for(let i=0;i<state.count;i++){
   const team=document.createElement('article');
   team.className='team '+letters[i].toLowerCase();
   team.innerHTML='<input id="name'+i+'" class="name" type="text" maxlength="20" aria-label="'+letters[i]+'팀 이름" autocomplete="off" spellcheck="false">'+
     '<output id="score'+i+'" class="score" aria-label="'+letters[i]+'팀 점수">0</output>'+
     '<div class="controls"><button type="button" class="minus" aria-label="'+letters[i]+'팀 1점 빼기">−</button>'+
     '<button type="button" class="plus" aria-label="'+letters[i]+'팀 1점 더하기">+</button></div>';
   team.querySelector('.minus').addEventListener('click',()=>change(i,-1));
   team.querySelector('.plus').addEventListener('click',()=>change(i,1));
   team.querySelector('.name').addEventListener('input',ev=>{state.names[i]=ev.target.value;persist()});
   board.appendChild(team);
 }
 draw();
}
function draw(){
 for(let i=0;i<state.count;i++){
   document.getElementById('score'+i).textContent=String(state.scores[i]);
   const input=document.getElementById('name'+i);
   if(document.activeElement!==input)input.value=state.names[i];
 }
 document.getElementById('undo').disabled=history.length===0;
 document.querySelectorAll('.team-count button[data-count]').forEach(btn=>btn.setAttribute('aria-pressed',String(Number(btn.dataset.count)===state.count)));
}
function checkpoint(){history.push([...state.scores]);if(history.length>100)history.shift()}
function change(team,delta){
 if(team>=state.count)return;
 const next=state.scores[team]+delta;
 if(next<0||!Number.isSafeInteger(next))return;
 checkpoint();state.scores[team]=next;persist();draw();
 document.getElementById('announce').textContent=state.names[team]+' '+next+'점';
}
document.querySelectorAll('.team-count button[data-count]').forEach(btn=>btn.addEventListener('click',()=>{
 const count=Number(btn.dataset.count);
 if(count===state.count)return;
 for(let i=state.maxTeams;i<count;i++)state.names[i]=randomNickname(state.names);
 state.maxTeams=Math.max(state.maxTeams,count);
 state.count=count;persist();buildTeams();
}));
document.getElementById('undo').addEventListener('click',()=>{
 const old=history.pop();if(!old)return;
 state.scores=old;persist();draw();
});
document.getElementById('reset').addEventListener('click',()=>{
 if(state.scores.every(score=>score===0))return;
 checkpoint();state.scores=[0,0,0,0];persist();draw();
 document.getElementById('announce').textContent='점수를 초기화했습니다.';
});
window.addEventListener('keydown',ev=>{
 if(ev.target instanceof HTMLInputElement)return;
 if(ev.key==='ArrowLeft'){ev.preventDefault();change(0,1)}
 else if(ev.key==='ArrowRight'){ev.preventDefault();change(1,1)}
 else if(ev.key==='Backspace'){const prev=history.pop();if(prev){ev.preventDefault();state.scores=prev;persist();draw()}}
});
buildTeams();
</script>
</body>
</html>
