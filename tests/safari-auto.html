<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Safari 자동 실행 실험 · 모아덱</title><style>body{font:16px -apple-system,system-ui,sans-serif;background:#0c1422;color:#f4f7ff;padding:32px;line-height:1.65}a,button{color:#cfdbff}button{background:#668cf6;color:#0e1930;border:0;border-radius:12px;padding:14px 18px;font:inherit;font-weight:700}.muted{color:#a8b6ce}</style></head><body><h1>Safari 자동 실행 실험</h1><p id="state">Safari 앱 직접 실행을 시도합니다.</p><p class="muted">현재 페이지에 머물러 있다면 ChatGPT 내부 브라우저가 외부 앱 호출을 차단했을 가능성이 있습니다.</p><button id="retry">사용자 탭으로 다시 시도</button><p><a href="../index.html">모아덱</a></p><script>const uri="x-safari-https://nick-41.github.io/moadeck/";function go(){document.getElementById('state').textContent='Safari URL 스킴 호출 중…';try{window.location.assign(uri)}catch(e){document.getElementById('state').textContent='브라우저에서 호출을 처리하지 못했습니다.'}}document.getElementById('retry').addEventListener('click',go);go();</script></body></html>
