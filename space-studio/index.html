<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5fc"><script src="../assets/tool-theme.js"></script><title>공간 배치 스튜디오 · 모아덱</title>
<style>

:root {
  color-scheme:light;
  --bg:#f7f5fc; --panel:#fff; --soft:#f3effa; --text:#231a3c; --muted:#635976;
  --line:#dfd8eb; --accent:#6042ac; --primary:#6042ac; --stage:#eeeaf6;
  --board:#fff; --board-edge:#75688b; --grid:#e7e1f0;
  --danger-bg:#fff0f0; --danger:#a9213e; --alert-bg:#fff2e8; --alert:#9a3412;
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --bg:#171124; --panel:#211932; --soft:#2d2241; --text:#f7f1ff; --muted:#c5bad7;
  --line:#514565; --accent:#d1beff; --primary:#7255bc; --stage:#181126;
  --board:#28203a; --board-edge:#a396be; --grid:#3b304f;
  --danger-bg:#442236; --danger:#ffb0c2; --alert-bg:#472b23; --alert:#ffd0ac;
}
*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
#space-v111{width:100%;max-width:1100px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding-bottom:env(safe-area-inset-bottom)}
.s-hd,.s-tools,.s-settings { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.s-hd { justify-content:space-between; gap:6px 12px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; }
.s-hd h1 { margin:0; font-size:clamp(15px, 3vw, 21px); letter-spacing:-.04em; }
.s-tools { padding:8px 12px; }
button { cursor:pointer; font-family:inherit; }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible, select:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.s-btn { min-height:44px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--text); padding:6px 10px; font-weight:650; font-size:13px; touch-action:manipulation; }
.s-main { background:var(--primary); color:white; border-color:var(--primary); }
.s-tip { margin:0; padding:6px 12px 8px; font-size:12px; color:var(--muted); }
.s-stage {
  background:var(--stage);
  padding:10px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
}
.s-surface { width:100%; }
.s-board {
  position:relative;
  width:min(100%, 360px);
  max-width:100%;
  margin-inline:auto;
  aspect-ratio:3/2;
  outline:1px solid var(--board-edge);
  background-color:var(--board);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  user-select:none;
  -webkit-user-select:none;
}
.s-shape, .s-shape * { touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.s-zoom { display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
.s-zoom button { min-width:44px; }
.s-zoom output { min-width:40px; text-align:center; font-size:12px; font-variant-numeric:tabular-nums; }
.s-editbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; }
.s-editbar select { flex:1 1 130px; max-width:340px; min-width:0; min-height:44px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--text); font:inherit; font-size:16px; padding:4px 8px; }
.s-room-actions { margin-left:auto; }
.s-viewbar { position:sticky; top:env(safe-area-inset-top); z-index:6; background:var(--panel); border-bottom:1px solid var(--line); }
.s-options { border-top:1px solid var(--line); }
.s-options summary { display:flex; align-items:center; min-height:44px; padding:0 12px; cursor:pointer; color:var(--text); font-size:13px; font-weight:700; }
.s-options summary::before { content:'›'; margin-right:7px; font-size:20px; }
.s-options[open] summary::before { transform:rotate(90deg); }
@media(max-width:430px) {
 .s-tools { gap:4px; }
 .s-zoom .s-btn { padding-inline:6px; }
 .s-editbar .s-status { flex-basis:100%; }
}

.s-shape{position:absolute;color:#243244;border:2px solid #7999c8;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;cursor:grab;min-height:0;min-width:0}
.s-shape b,.s-shape small{max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}.s-shape b{font-size:clamp(10px,3.5vw,15px)}.s-shape small{font-size:clamp(9px,2.6vw,12px);color:#41546c}
.s-shape.s-selected{outline:2px solid var(--accent);outline-offset:-1px;z-index:2}.s-shape.s-moving{z-index:3;box-shadow:0 4px 13px #214da53a}
.s-handle{position:absolute;width:28px;height:28px;display:flex;align-items:center;justify-content:center;z-index:4}
.s-handle:after{content:"";width:11px;height:11px;background:var(--panel);border:2px solid var(--accent);border-radius:3px;box-shadow:0 1px 5px #0002}
.s-handle[data-corner=nw]{left:-10px;top:-10px;cursor:nwse-resize}.s-handle[data-corner=ne]{right:-10px;top:-10px;cursor:nesw-resize}.s-handle[data-corner=sw]{left:-10px;bottom:-10px;cursor:nesw-resize}.s-handle[data-corner=se]{right:-10px;bottom:-10px;cursor:nwse-resize}
.s-popup { margin:0 12px 10px; padding:12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; color:var(--text); }
.s-popup[hidden]{display:none!important}.s-popupheader{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.s-popupheader strong{font-size:14px}.s-x{border:0;background:var(--soft);border-radius:7px;width:44px;height:44px;font-size:20px;color:var(--muted)}
.s-popup label{font-size:11px;font-weight:650;color:var(--muted);display:block}.s-popup input{display:block;width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;margin-top:5px;background:var(--panel);color:var(--text);font-size:16px;outline-color:var(--accent)}
.s-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.s-colors{display:flex;gap:7px;margin-top:13px}.s-color{flex:1;height:44px;border:1px solid var(--line);border-radius:5px}.s-color.on{outline:2px solid var(--accent);outline-offset:2px}
.s-popupactions{display:flex;justify-content:space-between;margin-top:15px;gap:10px}.s-popupactions button{min-height:44px;padding:9px 12px;border:0;border-radius:7px;font-weight:650;font-size:12px}.s-danger{background:var(--danger-bg);color:var(--danger)}.s-ok{background:var(--primary);color:white;min-width:70px}
.s-settings{padding:8px 12px;font-size:12px;color:var(--muted)}.s-settings label{display:flex;align-items:center;gap:5px}.s-settings input[type=number]{width:75px;min-height:44px;padding:6px;border:1px solid var(--line);border-radius:7px;font-size:16px}.s-settings input[type=checkbox]{accent-color:var(--primary)}.s-save{font-size:11px;color:var(--muted);background:var(--soft);border-radius:6px;padding:4px 7px}.s-save.bad{background:var(--alert-bg);color:var(--alert)}.s-status{font-size:12px;color:var(--muted)}

.s-transfer{padding:13px;border-top:1px solid var(--line);background:var(--soft)}
.s-transfer[hidden]{display:none!important}
.s-transferheader,.s-transferbuttons{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.s-transferheader strong{font-size:13px}
.s-transfer textarea{display:block;width:100%;min-height:130px;max-height:240px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:10px;font:11px/1.5 ui-monospace,SFMono-Regular,monospace;user-select:text;-webkit-user-select:text;touch-action:auto}
.s-transferbuttons{justify-content:flex-end;margin-top:9px;margin-bottom:5px}
.s-transferstatus{font-size:11px;color:var(--muted)}
</style><link rel="icon" type="image/svg+xml" href="../assets/icon.svg?v=moadeck">
<link rel="stylesheet" href="../assets/brand.css">
</head><body>
<div id="space-v111">

 <header class="s-hd"><a class="brand" href="../" aria-label="모아덱 MoaDeck 홈"><img src="../assets/icon.svg?v=moadeck" width="38" height="38" alt=""><span>모아덱</span><small>MoaDeck</small></a><h1>공간 배치 스튜디오</h1></header>
 <div class="s-tools">
  <button type="button" class="s-btn s-main" data-action="add">＋ 네모 추가</button>
  <button type="button" class="s-btn" data-action="undo">실행 취소</button>
  <span class="s-save s-room-actions" data-save>저장 상태 확인 중</span>
 </div>
 <div class="s-tools s-viewbar">
  <div class="s-zoom" role="group" aria-label="배치 화면 크기">
   <button type="button" class="s-btn" data-action="zoom-out" aria-label="축소">−</button>
   <output data-zoom aria-label="화면 맞춤 대비 배율">100%</output>
   <button type="button" class="s-btn" data-action="zoom-in" aria-label="확대">＋</button>
   <button type="button" class="s-btn" data-action="zoom-fit">전체 보기</button>
   <button type="button" class="s-btn" data-action="zoom-width">너비 맞춤</button>
  </div>
 </div>
 <div class="s-stage">
  <div class="s-surface" data-surface><div class="s-board" data-board></div></div>
 </div>
 <div class="s-editbar">
  <select data-select aria-label="개체 선택"><option value="">개체 선택</option></select>
  <button type="button" class="s-btn" data-action="edit" aria-controls="shapeEditor" aria-expanded="false" disabled>선택 편집</button>
  <span class="s-status" data-status></span>
 </div>
 <p class="s-tip">끌어서 이동 · 모서리로 크기 조절 · 좌표와 크기는 선택 편집</p>
  <section class="s-popup" id="shapeEditor" data-popup aria-label="네모 편집" hidden>
   <div class="s-popupheader"><strong>네모 편집</strong><button type="button" class="s-x" data-action="close" aria-label="편집 닫기">×</button></div>
   <label>이름<input type="text" maxlength="32" data-edit="name" placeholder="네모 이름"></label>
   <div class="s-fields"><label>가로 (cm)<input type="number" inputmode="numeric" min="30" data-edit="w"></label><label>세로 (cm)<input type="number" min="30" data-edit="h"></label></div>
   <div class="s-fields"><label>왼쪽에서 (cm)<input type="number" inputmode="numeric" min="0" data-edit="x"></label><label>위에서 (cm)<input type="number" inputmode="numeric" min="0" data-edit="y"></label></div>
   <div class="s-colors" data-colors></div>
   <div class="s-popupactions"><button type="button" class="s-danger" data-action="delete">네모 삭제</button><button type="button" class="s-ok" data-action="close">완료</button></div>
 </section>
 <details class="s-options">
  <summary>공간 설정 및 백업</summary>
  <div class="s-tools">
   <button type="button" class="s-btn" data-action="export">백업 복사</button>
   <button type="button" class="s-btn" data-action="import">백업 복원</button>
   <button type="button" class="s-btn" data-action="reset">초기화</button>
  </div>
 <div class="s-transfer" data-transfer hidden>
   <div class="s-transferheader"><strong data-transfer-title>배치 백업</strong><button type="button" class="s-x" data-action="transfer-close" aria-label="닫기">×</button></div>
   <textarea data-transfer-text rows="6" spellcheck="false" aria-label="백업 데이터"></textarea>
   <div class="s-transferbuttons"><button type="button" class="s-btn" data-action="select-text">전체 선택</button><button type="button" class="s-btn s-main" data-action="transfer-execute">클립보드에 복사</button></div>
   <div class="s-transferstatus" data-transfer-status>배치 데이터를 복사해 보관할 수 있습니다.</div>
 </div>
 <div class="s-settings"><label>공간 가로 <input type="number" min="200" max="2500" value="600" data-room="w">cm</label><label>세로 <input type="number" min="200" max="2500" value="400" data-room="h">cm</label><label><input type="checkbox" data-snap>5cm 맞춤</label></div>
 </details>
</div>
<script>
(()=>{
 const root=document.getElementById('space-v111');if(!root||root.dataset.started)return;root.dataset.started='yes';
 const $=s=>root.querySelector(s),board=$('[data-board]'),surface=$('[data-surface]'),popup=$('[data-popup]'),picker=$('[data-select]');
 const colors=['#b5d4fa','#bce4ca','#f9d89c','#f5bac6','#d8c9f6','#cbd5e1'];
 const first=()=>({room:{w:600,h:400},rects:[{id:'n1',name:'네모 1',x:100,y:100,w:160,h:100,color:colors[0]}],selectedId:null,nextId:2,snap:false,updatedAt:0});
 let state=first(),undo=[],drag=null;const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
 const snapshot=()=>JSON.parse(JSON.stringify(state));const remember=()=>{undo.push(snapshot());if(undo.length>40)undo.shift()};
 const zoomOut=$('[data-action="zoom-out"]'),zoomIn=$('[data-action="zoom-in"]');
 const zoomOutput=$('[data-zoom]'),editButton=$('[data-action="edit"]');
 const minZoom=0.6;
 let zoom=1, visibleZoom=1;
 function sizeBoard(){
  const width=surface.clientWidth;
  if(!width)return;
  const roomRatio=state.room.w/state.room.h;
  const boardTop=surface.getBoundingClientRect().top+window.scrollY;
  const fitHeight=clamp(Math.floor(window.innerHeight-boardTop-18),100,570);
  const fitWidth=Math.min(width, fitHeight*roomRatio);
  const boardWidth=Math.min(width, fitWidth*zoom);
  visibleZoom=boardWidth/fitWidth;
  board.style.width=boardWidth+'px';
  board.style.aspectRatio=state.room.w+'/'+state.room.h;
  zoomOutput.value=Math.round(visibleZoom*100)+'%';
  zoomOut.disabled=visibleZoom<=minZoom+.001;
  zoomIn.disabled=width-boardWidth<1;
 }
 const STORE_KEY='space_studio_layout_v1';
 const saveIndicator=$('[data-save]');
 function validate(raw){
   if(!raw||typeof raw!=='object'||!raw.room||!Array.isArray(raw.rects))return null;
   const num=(v,defaultValue)=>Number.isFinite(Number(v))?Number(v):defaultValue;
   const w=clamp(Math.round(num(raw.room.w,600)),200,2500),h=clamp(Math.round(num(raw.room.h,400)),200,2500);
   const seen=new Set();let sequence=1;
   const rects=raw.rects.slice(0,150).flatMap(r=>{
      if(!r||typeof r!=='object')return [];
      const id='n'+sequence++; seen.add(id);
      const rw=clamp(Math.round(num(r.w,140)),30,w),rh=clamp(Math.round(num(r.h,90)),30,h);
      return [{id,name:String(r.name||('네모 '+(sequence-1))).slice(0,32),x:clamp(Math.round(num(r.x,0)),0,w-rw),y:clamp(Math.round(num(r.y,0)),0,h-rh),w:rw,h:rh,color:colors.includes(r.color)?r.color:colors[0]}];
   });
   return {room:{w,h},rects,selectedId:null,nextId:rects.length+1,snap:!!raw.snap,updatedAt:clamp(Math.round(num(raw.updatedAt,0)),0,9999999999999)};
 }
 function publish(){state.updatedAt=Math.max(Date.now(),(state.updatedAt||0)+1);persist();globalThis.__bindings?.setValue?.(snapshot());}
 function persist(){
   try{localStorage.setItem(STORE_KEY,JSON.stringify({version:1,room:state.room,rects:state.rects,snap:state.snap,updatedAt:state.updatedAt}));saveIndicator.textContent='● 자동 저장됨';saveIndicator.classList.remove('bad')}
   catch(_){saveIndicator.textContent='자동 저장 제한됨';saveIndicator.classList.add('bad')}
 }
 try{const previous=localStorage.getItem(STORE_KEY);if(previous){const restored=validate(JSON.parse(previous));if(restored)state=restored}}catch(_){}
 let transferMode='export';
 const transfer=$('[data-transfer]'),transferText=$('[data-transfer-text]'),transferTitle=$('[data-transfer-title]'),transferStatus=$('[data-transfer-status]'),transferExecute=$('[data-action="transfer-execute"]');
 function transferOpen(mode){
  transferMode=mode;
  if(mode==='export'){
    transferTitle.textContent='배치 백업';
    transferText.value=JSON.stringify({format:'space-studio',version:'1.1.1',room:state.room,rects:state.rects,snap:state.snap,updatedAt:state.updatedAt},null,2);
    transferText.readOnly=true;
    transferExecute.textContent='클립보드에 복사';
    transferStatus.textContent='클립보드로 복사하거나 텍스트를 직접 선택해 저장하세요.';
  }else{
    transferTitle.textContent='배치 복원';
    transferText.value='';transferText.readOnly=false;
    transferExecute.textContent='배치 복원 적용';
    transferStatus.textContent='저장한 JSON을 붙여넣고 복원 적용을 누르세요.';
  }
  transfer.hidden=false;
 }
 async function transferApply(){
  if(transferMode==='export'){
   const content=transferText.value;
   try{
     if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');
     await navigator.clipboard.writeText(content);
     transferStatus.textContent='복사 완료 · 메모 또는 파일에 붙여넣어 보관하세요.';
   }catch(_){
     transferText.focus();transferText.select();transferText.setSelectionRange(0,content.length);
     transferStatus.textContent='자동 복사가 제한됩니다. 선택된 내용을 복사하세요.';
   }
  }else{
   try{
     const raw=JSON.parse(transferText.value);
     if(raw.format&&raw.format!=='space-studio')throw new Error('wrong format');
     const loaded=validate(raw);if(!loaded)throw new Error('invalid data');
     remember();state=loaded;close();draw();publish();
     transfer.hidden=true;
     saveIndicator.textContent='복원 완료 · 자동 저장됨';saveIndicator.classList.remove('bad');
   }catch(_){transferStatus.textContent='복원 실패: 유효한 공간배치 JSON인지 확인하세요.';}
  }
 }
 async function copyBackupDirect(){
  const content=JSON.stringify({format:'space-studio',version:'1.1.2',room:state.room,rects:state.rects,snap:state.snap,updatedAt:state.updatedAt},null,2);
  try{
   if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');
   await navigator.clipboard.writeText(content);
   transfer.hidden=true;
   saveIndicator.textContent='✓ 백업 복사 완료';
   saveIndicator.classList.remove('bad');
  }catch(_){
   transferOpen('export');
   transferStatus.textContent='이 환경에서는 즉시 복사가 제한됩니다. 아래 데이터를 직접 복사하세요.';
   transferText.focus();transferText.select();
   try{transferText.setSelectionRange(0,transferText.value.length)}catch(_){}
  }
 }
 const chosen=()=>state.rects.find(r=>r.id===state.selectedId);const sn=n=>state.snap?Math.round(n/5)*5:Math.round(n);
 function loc(el,r){el.style.left=(100*r.x/state.room.w)+'%';el.style.top=(100*r.y/state.room.h)+'%';el.style.width=(100*r.w/state.room.w)+'%';el.style.height=(100*r.h/state.room.h)+'%';}
 function draw(){sizeBoard();board.style.backgroundSize=`${2000/state.room.w}% ${2000/state.room.h}%`;board.replaceChildren();
  for(const r of state.rects){const el=document.createElement('div');el.className='s-shape'+(r.id===state.selectedId?' s-selected':'');el.dataset.id=r.id;el.style.background=r.color;loc(el,r);
   const label=document.createElement('b');label.textContent=r.name;const size=document.createElement('small');size.textContent=r.w+' × '+r.h;el.append(label,size);
   if(r.id===state.selectedId){for(const corner of ['nw','ne','sw','se']){const h=document.createElement('div');h.className='s-handle';h.dataset.corner=corner;el.append(h)}}board.append(el)}
  picker.replaceChildren(new Option('개체 선택',''),...state.rects.map(r=>new Option(r.name,r.id)));
  picker.value=state.selectedId??'';
  picker.disabled=state.rects.length===0;
  editButton.disabled=!chosen();
  $('[data-action="add"]').disabled=state.rects.length>=150;
  $('[data-action="undo"]').disabled=undo.length===0;
  $('[data-room=w]').value=state.room.w;
  $('[data-room=h]').value=state.room.h;
  $('[data-snap]').checked=state.snap;
  $('[data-status]').textContent=`네모 ${state.rects.length}개 · ${state.room.w} × ${state.room.h}cm`;
  persist();
 }
 function close(){popup.hidden=true;editButton.setAttribute('aria-expanded','false')}
 function openPopup(){const r=chosen();if(!r)return;for(const key of ['name','w','h','x','y'])$('[data-edit='+key+']').value=r[key];
  const host=$('[data-colors]');host.replaceChildren();for(const color of colors){const b=document.createElement('button');b.type='button';b.className='s-color'+(r.color===color?' on':'');b.style.background=color;b.setAttribute('aria-label','색상');b.onclick=()=>{remember();r.color=color;draw();openPopup();publish()};host.append(b)}popup.hidden=false;editButton.setAttribute('aria-expanded','true');
 }
 root.addEventListener('click',ev=>{const button=ev.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
  if(action.startsWith('zoom-')){
   if(action==='zoom-out')zoom=Math.max(minZoom,visibleZoom/1.25);
   if(action==='zoom-in')zoom=visibleZoom*1.25;
   if(action==='zoom-fit')zoom=1;
   if(action==='zoom-width')zoom=Infinity;
   sizeBoard();
   return;
  }
  if(action==='edit'){
   if(popup.hidden)openPopup();
   else close();
  }
  if(action==='add'){if(state.rects.length>=150)return;remember();const id='n'+state.nextId,w=Math.min(140,state.room.w),h=Math.min(90,state.room.h);state.rects.push({id,name:'네모 '+state.nextId,x:clamp(state.nextId*34,0,state.room.w-w),y:clamp(state.nextId*26,0,state.room.h-h),w,h,color:colors[(state.nextId-1)%colors.length]});state.nextId++;state.selectedId=id;close();draw();}
  if(action==='undo'&&undo.length){state=undo.pop();close();draw()}
  if(action==='reset'){remember();state=first();close();draw()}
  if(action==='close'){close();picker.focus();}
  if(action==='export')copyBackupDirect();
  if(action==='import')transferOpen('import');
  if(action==='transfer-close')transfer.hidden=true;
  if(action==='select-text'){transferText.focus();transferText.select();transferText.setSelectionRange(0,transferText.value.length);}
  if(action==='transfer-execute')transferApply();
  if(action==='delete'){const r=chosen();if(!r)return;remember();state.rects=state.rects.filter(x=>x.id!==r.id);state.selectedId=null;close();draw()}
  if(['add','undo','reset','delete'].includes(action))publish();
 });
 picker.addEventListener('change',()=>{
  state.selectedId=picker.value||null;
  draw();
  if(state.selectedId&&!popup.hidden)openPopup();
  else close();
 });
 const nameInput=$('[data-edit=name]');
 let savedNameEdit=false;
 nameInput.addEventListener('blur',()=>{savedNameEdit=false});
 nameInput.addEventListener('input',()=>{
  const r=chosen();
  if(!r||r.name===nameInput.value)return;
  if(!savedNameEdit){
   remember();
   savedNameEdit=true;
  }
  r.name=nameInput.value.slice(0,32);
  draw();
  publish();
 });
 for(const key of ['w','h','x','y']){
  const el=$('[data-edit='+key+']');
  el.addEventListener('change',()=>{
   const r=chosen();
   if(!r)return;
   const limit={w:state.room.w-r.x,h:state.room.h-r.y,x:state.room.w-r.w,y:state.room.h-r.h};
   const value=el.valueAsNumber;
   const next=Number.isFinite(value)?clamp(Math.round(value),key==='w'||key==='h'?30:0,limit[key]):r[key];
   el.value=next;
   if(next===r[key])return;
   remember();
   r[key]=next;
   draw();
   publish();
  });
 }
 for(const k of ['w','h'])$(`[data-room=${k}]`).addEventListener('change',ev=>{const n=Number(ev.target.value);if(!ev.target.value.trim()||!Number.isFinite(n)){draw();return}remember();state.room[k]=clamp(Math.round(n),200,2500);state.rects.forEach(r=>{r.w=Math.min(r.w,state.room.w);r.h=Math.min(r.h,state.room.h);r.x=clamp(r.x,0,state.room.w-r.w);r.y=clamp(r.y,0,state.room.h-r.h)});close();draw();publish()});
 $('[data-snap]').addEventListener('change',ev=>{state.snap=ev.target.checked;publish()});
 function begin(cx,cy,target,mode,pid){const el=target.closest('.s-shape');if(!el||!board.contains(el))return;const r=state.rects.find(q=>q.id===el.dataset.id);if(!r)return;const h=target.closest('.s-handle');drag={id:r.id,el,mode,pid,corner:h?.dataset.corner||null,sx:cx,sy:cy,origin:{...r},moved:false,saved:false};}
 function move(cx,cy){const g=drag;if(!g)return;const r=state.rects.find(v=>v.id===g.id),b=board.getBoundingClientRect();if(!r||!b.width||!b.height)return;const dx=(cx-g.sx)*state.room.w/b.width,dy=(cy-g.sy)*state.room.h/b.height;
  if(Math.hypot(cx-g.sx,cy-g.sy)>5)g.moved=true;if(!g.moved)return;if(!g.saved){remember();g.saved=true;g.el.classList.add('s-moving')}
  let {x,y,w,h}=g.origin;const o=g.origin;if(!g.corner){x=clamp(sn(o.x+dx),0,state.room.w-w);y=clamp(sn(o.y+dy),0,state.room.h-h)}else{let l=o.x,t=o.y,rt=o.x+o.w,bt=o.y+o.h;
   if(g.corner.includes('w'))l=clamp(sn(o.x+dx),0,rt-30);if(g.corner.includes('e'))rt=clamp(sn(o.x+o.w+dx),l+30,state.room.w);
   if(g.corner.includes('n'))t=clamp(sn(o.y+dy),0,bt-30);if(g.corner.includes('s'))bt=clamp(sn(o.y+o.h+dy),t+30,state.room.h);
   x=l;y=t;w=rt-l;h=bt-t;}
  Object.assign(r,{x,y,w,h});loc(g.el,r);g.el.querySelector('small').textContent=w+' × '+h;
 }
 function end(){
  if(!drag)return;
  const g=drag, keepEditor=state.selectedId===g.id&&!popup.hidden;
  drag=null;
  state.selectedId=g.id;
  draw();
  if(keepEditor)openPopup();
  else close();
  if(g.moved)publish();
 }
 const prevent=e=>{if(e.cancelable)e.preventDefault();e.stopPropagation()};
 board.addEventListener('touchstart',e=>{if(drag||e.touches.length!==1||!e.target.closest('.s-shape'))return;prevent(e);const t=e.changedTouches[0];begin(t.clientX,t.clientY,e.target,'touch',t.identifier)},{capture:true,passive:false});
 document.addEventListener('touchmove',e=>{if(!drag||drag.mode!=='touch')return;prevent(e);const t=Array.from(e.changedTouches).find(t=>t.identifier===drag.pid);if(t)move(t.clientX,t.clientY)},{capture:true,passive:false});
 for(const eventName of ['touchend','touchcancel'])document.addEventListener(eventName,e=>{if(!drag||drag.mode!=='touch')return;const found=Array.from(e.changedTouches).some(t=>t.identifier===drag.pid);if(found){prevent(e);end()}},{capture:true,passive:false});
 board.addEventListener('pointerdown',e=>{if(drag||e.button!==0)return;if(e.target===board){if(state.selectedId){state.selectedId=null;close();draw()}return}if(e.pointerType==='touch'||!e.target.closest('.s-shape'))return;e.preventDefault();begin(e.clientX,e.clientY,e.target,'pointer',e.pointerId);try{board.setPointerCapture(e.pointerId)}catch(_){} });
 board.addEventListener('pointermove',e=>{if(drag&&drag.mode==='pointer'&&drag.pid===e.pointerId)move(e.clientX,e.clientY)});
 board.addEventListener('pointerup',e=>{if(drag&&drag.mode==='pointer'&&drag.pid===e.pointerId)end()});
 board.addEventListener('pointercancel',e=>{if(drag&&drag.mode==='pointer'&&drag.pid===e.pointerId)end()});
 board.addEventListener('dragstart',e=>e.preventDefault());board.addEventListener('contextmenu',e=>e.preventDefault());
 draw();
 window.addEventListener('resize',sizeBoard);
 globalThis.__effect?.(()=>{const incoming=globalThis.__bindings?.value;if(!incoming||drag)return;const normalized=validate(incoming);if(normalized&&normalized.updatedAt>state.updatedAt){state=normalized;close();draw()}});
})();
