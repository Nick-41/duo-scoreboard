<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5fc">
  <meta name="description" content="모아덱(MoaDeck)에서 점수판, 대형 글씨, 타이머, 동전과 주사위, 공간 배치 도구를 바로 여세요.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="모아덱">
  <meta property="og:title" content="모아덱 MoaDeck">
  <meta property="og:description" content="점수판, 타이머, 동전과 주사위, 공간 배치를 한곳에서.">
  <link rel="manifest" href="manifest.webmanifest?v=moadeck">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg?v=moadeck">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="assets/brand.css">
  <title>모아덱 MoaDeck</title>
  <script>
    try {
      const theme = localStorage.getItem('duo-hub-theme-v1');
      if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#171124';
      }
    } catch {}
  </script>
  <style>

:root {
  color-scheme: light;
  --background: #f7f5fc;
  --surface: #fff;
  --ink: #231a3c;
  --muted: #635976;
  --line: #dfd8eb;
  --accent: #6042ac;
  --selected: #eae1ff;
  --theme-color: #f7f5fc;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #171124;
  --surface: #211932;
  --ink: #f7f1ff;
  --muted: #c5bad7;
  --line: #443956;
  --accent: #d1beff;
  --selected: #362650;
  --theme-color: #171124;
}
* { box-sizing: border-box; }
html { background: var(--background); }
body { margin: 0; min-height: 100dvh; color: var(--ink); }
button, input { font: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: inherit; text-decoration: none; }
:where(a, button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.shell {
  max-width: 1080px;
  margin-inline: auto;
  padding-inline: max(clamp(16px, 4vw, 48px), env(safe-area-inset-left))
                  max(clamp(16px, 4vw, 48px), env(safe-area-inset-right));
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-block: calc(16px + env(safe-area-inset-top)) 16px;
}
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--muted);
  background: var(--surface);
  font-size: 13px;
  font-weight: 700;
}
.icon-button svg, .search svg { width: 18px; height: 18px; flex: none; }
.section { margin-block: 12px 36px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 17px; }
.section-head h1 { margin: 0; font-size: 25px; letter-spacing: -.05em; }
.result-count { color: var(--muted); font-size: 13px; }
.tools-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  align-items: center;
  margin-bottom: 17px;
}
.search {
  display: flex;
  align-items: center;
  flex: 1 1 240px;
  gap: 9px;
  min-width: 0;
  min-height: 46px;
  padding-inline: 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--muted);
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.search input { width: 100%; min-width: 0; min-height: 44px; padding: 0; outline: none; border: 0; color: var(--ink); background: transparent; font-size: 16px; }
.search input::placeholder { color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button {
  min-height: 44px;
  padding-inline: 12px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 720;
}
.filters button:hover { background: var(--surface); }
.filters button[aria-pressed="true"] { border-color: var(--line); background: var(--selected); color: var(--accent); }
.tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.tool-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  transition: border-color .18s, box-shadow .18s;
}
.tool-card:hover, .tool-card:focus-within { border-color: var(--accent); box-shadow: 0 5px 18px #39236012; }
.tool-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 123px; padding: 15px 8px 15px 17px; border-radius: 17px; }
.tool-icon { width: 53px; height: 53px; display: grid; place-items: center; border-radius: 15px; background: #e6e5ff; color: #4a40a2; }
.tool-card[data-tone="purple"] .tool-icon { background: #f4e0f7; color: #773982; }
.tool-card[data-tone="orange"] .tool-icon { background: #ffeadb; color: #88451f; }
.tool-card[data-tone="mint"] .tool-icon { background: #d9f3ea; color: #226b56; }
.tool-card[data-tone="lavender"] .tool-icon { background: #e9e0fb; color: #6042ac; }
.tool-icon svg { width: 25px; height: 25px; }
.tool-card h3 { margin: 0; font-size: clamp(16px, 2vw, 20px); line-height: 1.28; letter-spacing: -.045em; word-break: keep-all; }
.tool-card p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; word-break: keep-all; }
.tool-arrow { width: 16px; height: 16px; color: var(--accent); }
.favorite {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-right: 9px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: var(--muted);
}
.favorite:hover, .favorite[aria-pressed="true"] { background: var(--selected); color: var(--accent); }
.favorite svg { width: 19px; height: 19px; }
.favorite[aria-pressed="true"] svg { fill: currentColor; }
.empty { padding: 38px 16px; border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); text-align: center; }
.footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 9px 20px;
  padding-block: 19px calc(24px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}
.footer a { text-decoration: underline; text-underline-offset: 3px; }
[hidden] { display: none !important; }
@media (max-width: 699px) {
  .tool-grid { grid-template-columns: 1fr; gap: 10px; }
  .tool-main { min-height: 94px; }
}
@media (max-width: 420px) {
  .tool-main { gap: 10px; padding-left: 12px; }
  .tool-icon { width: 44px; height: 44px; border-radius: 12px; }
  .tool-icon svg { width: 22px; height: 22px; }
  .favorite { margin-right: 4px; }
  .filters button { padding-inline: 10px; }
}
@media (prefers-reduced-motion: reduce) { .tool-card { transition: none; } }
  </style>
</head>
<body>
<svg style="display:none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-score" viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-8M22 19v-4" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></symbol>
<symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M8 19h8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2M9 2h6M18 6l2-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="i-layout" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 3v18M9 12h12" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/></symbol>
<symbol id="i-wheel" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17M6 6l12 12M6 18 18 6"/></g></symbol>
<symbol id="i-ticket" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4zM14 8v1m0 3v1m0 3v1"/></g></symbol>
<symbol id="i-counter" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 12h4m-2-2v4m5-2h3"/></g></symbol>
<symbol id="i-vote" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12H5l-2 3v5h18v-5l-2-3h-2M3 15h18M8 11l-1-6 8-2 2 8zM10 7l2 1 2-3"/></g></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14a8.5 8.5 0 0 1-10.5-10A8.5 8.5 0 1 0 20.5 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="./" aria-label="모아덱 MoaDeck 홈"><img src="assets/icon.svg?v=moadeck" width="38" height="38" alt=""><span>모아덱</span><small>MoaDeck</small></a>
    <button id="themeBtn" class="icon-button" type="button">
      <svg aria-hidden="true"><use id="themeIcon" href="#i-moon"/></svg>
      <span id="themeLabel">다크 모드</span>
    </button>
  </header>
  <main>
    <section id="tools" class="section" aria-labelledby="tools-heading">
      <div class="section-head">
        <h1 id="tools-heading">도구 모음</h1>
        <span id="resultCount" class="result-count" aria-live="polite"></span>
      </div>
      <div class="tools-bar">
        <label class="search">
          <svg aria-hidden="true"><use href="#i-search"/></svg>
          <input id="searchInput" type="search" aria-label="도구 검색" placeholder="도구 검색" autocomplete="off">
        </label>
        <div id="filters" class="filters" role="group" aria-label="도구 분류">
          <button type="button" data-filter="전체" aria-pressed="true">전체</button>
          <button type="button" data-filter="즐겨찾기" aria-pressed="false">즐겨찾기</button>
          <button type="button" data-filter="게임" aria-pressed="false">게임</button>
          <button type="button" data-filter="일상" aria-pressed="false">일상</button>
          <button type="button" data-filter="작업" aria-pressed="false">작업</button>
        </div>
      </div>
      <div id="toolGrid" class="tool-grid"></div>
      <p id="empty" class="empty" hidden></p>
    </section>
  </main>
  <footer class="footer">
    <span>점수, 즐겨찾기, 설정은 현재 브라우저에 저장됩니다.</span>
    <a href="https://github.com/Nick-41/moadeck" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>
</div>
<script>
'use strict';

const tools = [
  { id: 'scoreboard', name: '점수판', description: '2~4팀 점수 기록과 실행 취소', category: '게임', tone: 'blue', icon: 'score', path: 'tools/scoreboard.html' },
  { id: 'bigtext', name: '대형 글씨', description: '메시지를 화면 가득 표시', category: '일상', tone: 'purple', icon: 'type', path: 'tools/bigtext.html' },
  { id: 'timer', name: '타이머 · 스톱워치', description: '카운트다운과 경과 시간 측정', category: '일상', tone: 'orange', icon: 'clock', path: 'tools/timer.html' },
  { id: 'chance', name: '동전 · 주사위', description: '1~20개 던지기와 결과 합계', category: '게임', tone: 'mint', icon: 'dice', path: 'tools/chance.html' },
  { id: 'roulette', name: '룰렛', description: '항목을 넣고 돌려서 하나 고르기', category: '게임', tone: 'purple', icon: 'wheel', path: 'tools/roulette.html' },
  { id: 'lots', name: '제비뽑기', description: '번호표를 골라 중복 없이 뽑기', category: '게임', tone: 'orange', icon: 'ticket', path: 'tools/lots.html' },
  { id: 'counters', name: '멀티카운터', description: '여러 항목의 수량을 따로 세고 합산', category: '일상', tone: 'blue', icon: 'counter', path: 'tools/counters.html' },
  { id: 'vote', name: '투표판', description: '한 기기에서 표를 모아 득표율 확인', category: '일상', tone: 'mint', icon: 'vote', path: 'tools/vote.html' },
  { id: 'layout', name: '공간 배치 스튜디오', description: '가구 이동, 5cm 정렬, 배치 저장', category: '작업', tone: 'lavender', icon: 'layout', path: 'space-studio/index.html' }
];

const favoriteKey = 'duo-hub-favorites-v1';
const themeKey = 'duo-hub-theme-v1';
const grid = document.getElementById('toolGrid');
const empty = document.getElementById('empty');
const counter = document.getElementById('resultCount');
const search = document.getElementById('searchInput');
const filters = document.getElementById('filters');
const themeButton = document.getElementById('themeBtn');
let activeFilter = '전체';
let favoriteIds = new Set();

function readSetting(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function writeSetting(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

try {
  const savedFavorites = JSON.parse(readSetting(favoriteKey));
  if (Array.isArray(savedFavorites)) {
    favoriteIds = new Set(savedFavorites.filter(id => typeof id === 'string'));
  }
} catch {}

function svgIcon(name, className) {
  return '<svg class="' + className + '" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
}

function createCard(tool) {
  const card = document.createElement('article');
  card.className = 'tool-card';
  card.dataset.tone = tool.tone;

  const link = document.createElement('a');
  link.className = 'tool-main';
  link.href = tool.path;

  const icon = document.createElement('span');
  icon.className = 'tool-icon';
  icon.innerHTML = svgIcon(tool.icon, '');

  const text = document.createElement('div');
  const title = document.createElement('h3');
  title.textContent = tool.name;
  const description = document.createElement('p');
  description.textContent = tool.description;
  text.append(title, description);
  link.append(icon, text);
  link.insertAdjacentHTML('beforeend', svgIcon('arrow', 'tool-arrow'));

  const star = document.createElement('button');
  star.className = 'favorite';
  star.type = 'button';
  star.dataset.toolId = tool.id;
  star.setAttribute('aria-label', tool.name + ' 즐겨찾기');
  star.setAttribute('aria-pressed', String(favoriteIds.has(tool.id)));
  star.innerHTML = svgIcon('star', '');
  star.addEventListener('click', () => {
    const restoreFocus = document.activeElement === star;
    if (favoriteIds.has(tool.id)) {
      favoriteIds.delete(tool.id);
    } else {
      favoriteIds.add(tool.id);
    }
    writeSetting(favoriteKey, JSON.stringify([...favoriteIds]));
    render();
    if (restoreFocus) {
      const target = grid.querySelector('[data-tool-id="' + tool.id + '"]') ??
        grid.querySelector('.favorite') ?? filters.querySelector('[aria-pressed="true"]');
      target.focus();
    }
  });
  card.append(link, star);
  return card;
}

function render() {
  const query = search.value.trim().toLocaleLowerCase('ko');
  const matched = tools.filter(tool => {
    const matchesFilter = activeFilter === '전체' || tool.category === activeFilter ||
      (activeFilter === '즐겨찾기' && favoriteIds.has(tool.id));
    const searchable = [tool.name, tool.description, tool.category].join(' ').toLocaleLowerCase('ko');
    return matchesFilter && searchable.includes(query);
  });
  matched.sort((a, b) => Number(favoriteIds.has(b.id)) - Number(favoriteIds.has(a.id)));
  grid.replaceChildren(...matched.map(createCard));
  empty.hidden = matched.length > 0;
  empty.textContent = activeFilter === '즐겨찾기' && !query
    ? '도구 옆 별표를 눌러 즐겨찾기에 추가하세요.'
    : '일치하는 도구가 없습니다.';
  counter.textContent = matched.length + '개';
  filters.querySelectorAll('button').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.filter === activeFilter));
  });
}

filters.addEventListener('click', event => {
  const button = event.target.closest('button[data-filter]');
  if (!button) return;
  activeFilter = button.dataset.filter;
  render();
});
search.addEventListener('input', render);
document.addEventListener('keydown', event => {
  if (event.key === '/' && !event.ctrlKey && !event.metaKey && !event.altKey &&
      !document.activeElement.matches('input, textarea, [contenteditable="true"]')) {
    event.preventDefault();
    search.focus();
  }
  if (event.key === 'Escape' && document.activeElement === search) {
    search.value = '';
    search.blur();
    render();
  }
});

function applyTheme(theme) {
  const dark = theme === 'dark';
  document.documentElement.dataset.theme = theme;
  document.getElementById('themeIcon').setAttribute('href', dark ? '#i-sun' : '#i-moon');
  document.getElementById('themeLabel').textContent = dark ? '라이트 모드' : '다크 모드';
  document.querySelector('meta[name="theme-color"]').content =
    getComputedStyle(document.documentElement).getPropertyValue('--theme-color').trim();
}

applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
themeButton.addEventListener('click', () => {
  const theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  applyTheme(theme);
  writeSetting(themeKey, theme);
});
render();
</script>
</body>
</html>
